<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="50%" stop-color="#0e1726"/>
      <stop offset="100%" stop-color="#050a14"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1744"/>
      <stop offset="50%" stop-color="#ff5252"/>
      <stop offset="100%" stop-color="#00e676"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#00b0ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background App Tile with Rounded Rect -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="113" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="3"/>

  <!-- Orbital Concentric Arcs -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="2" stroke-dasharray="6,8"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(0, 229, 255, 0.2)" stroke-width="2" stroke-dasharray="8,6"/>
  <circle cx="256" cy="256" r="95" fill="none" stroke="rgba(255, 23, 68, 0.3)" stroke-width="3"/>

  <!-- Cyber Shield & Spring Emblem -->
  <g filter="url(#glow)">
    <!-- Outer Shield Contour -->
    <path d="M 256,90 L 370,140 C 370,270 290,360 256,410 C 222,360 142,270 142,140 Z" 
          fill="none" stroke="url(#neonGrad)" stroke-width="12" stroke-linejoin="round"/>
    
    <!-- Spring Spiral Coil -->
    <path d="M 210,180 Q 256,150 302,180 Q 256,210 210,240 Q 256,210 302,240 Q 256,270 210,300 Q 256,270 302,300 Q 256,330 220,360" 
          fill="none" stroke="url(#cyanGrad)" stroke-width="10" stroke-linecap="round"/>

    <!-- Central Core Radar Pulse -->
    <circle cx="256" cy="256" r="18" fill="#ff1744" />
    <circle cx="256" cy="256" r="8" fill="#ffffff" />
  </g>

  <!-- Decorative Orbit Nodes -->
  <circle cx="396" cy="200" r="10" fill="#00e5ff" filter="url(#glow)"/>
  <circle cx="116" cy="312" r="10" fill="#00e676" filter="url(#glow)"/>
  <circle cx="340" cy="380" r="8" fill="#ff9100" filter="url(#glow)"/>
</svg>
